[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "before-you-send"
version = "0.2.0"
description = "Reads a PDF and reports what is still inside it that you may not mean to send. Runs entirely on your machine."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Waiga Arya" }]
keywords = ["pdf", "redaction", "metadata", "privacy", "leak", "review", "pypdf"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Legal Industry",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Utilities",
]
dependencies = ["pypdf>=5.1"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/Waiga/before-you-send"
Issues = "https://github.com/Waiga/before-you-send/issues"

[project.scripts]
before-you-send = "before_you_send.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["before_you_send"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
# Reading a file format somebody else produced is exactly where a broad except
# belongs. A malformed object must cost one check, never the whole run.
ignore = ["B904", "BLE001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
