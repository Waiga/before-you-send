[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "before-you-send"
version = "0.3.0"
description = "Reads a PDF and reports what is still inside it that you may not mean to send. Runs entirely on your machine."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Waiga Arya" }]
keywords = ["pdf", "redaction", "metadata", "privacy", "leak", "review", "pypdf"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Legal Industry",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Utilities",
]
# The crypto extra, not bare pypdf. A PDF encrypted with AES needs
# cryptography to open, and publishers encrypt with an empty user password as
# a matter of routine. Without it the tool told the sender their perfectly
# good document was truncated or damaged: 15 of 250 gov.uk documents in one
# measured corpus. Verified to resolve cryptography at both ends of this
# range, pypdf 5.1.0 and 6.19.0.
dependencies = ["pypdf[crypto]>=5.1"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/Waiga/before-you-send"
Issues = "https://github.com/Waiga/before-you-send/issues"

[project.scripts]
before-you-send = "before_you_send.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["before_you_send"]

[tool.ruff]
line-length = 100
target-version = "py39"
# scripts/ holds the measurement programs exactly as they were run, byte for byte.
# Reformatting them would mean the committed file is no longer the file that
# produced the published numbers, which is the only reason they are worth
# committing. They are a record, not library code, and nothing imports them.
extend-exclude = ["scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
# Reading a file format somebody else produced is exactly where a broad except
# belongs. A malformed object must cost one check, never the whole run.
ignore = ["B904", "BLE001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
